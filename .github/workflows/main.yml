name: Deploy HunzWeb-O51W

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Firebase
        run: npm install -g firebase-tools

      - name: Buat konfigurasi Hosting
        run: |
          cat > firebase.json <<'EOF'
          {
            "hosting": {
              "public": ".",
              "ignore": [
                "firebase.json",
                "firestore.rules",
                ".git/**",
                ".github/**"
              ]
            }
          }
          EOF

      - name: Deploy ke Firebase
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$GOOGLE_APPLICATION_CREDENTIALS"
          firebase deploy --only hosting --project bisnis-portofolioku
