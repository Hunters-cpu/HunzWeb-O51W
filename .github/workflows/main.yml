name: Deploy HunzWeb-O51W

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Login ke Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'

      - name: Siapkan Firebase CLI
        run: npm install -g firebase-tools

      - name: Buat konfigurasi Hosting
        run: |
          cat > firebase.json <<'EOF'
          {
            "hosting": {
              "public": ".",
              "ignore": [
                "firebase.json",
                "firestore.rules",
                ".git/**",
                ".github/**"
              ]
            }
          }
          EOF

      - name: Deploy ke Firebase
        run: firebase deploy --only hosting --project bisnis-portofolioku
